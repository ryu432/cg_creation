<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- ホーム画面に追加したとき、アプリのように全画面で開く（PWA） -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFF8F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1E1A17" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plano" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- 一度開けば、電波がなくても開けるようにする（public/sw.js） -->
    <script>
      // 「ホーム画面に追加」の案内（Android の Chrome など）。アプリが読み込まれる前に来ることがあるので、ここで受け取っておく
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__planoInstallPrompt = e;
        window.dispatchEvent(new Event('plano-install-change'));
      });
      window.addEventListener('appinstalled', function () {
        window.__planoInstallPrompt = null;
        window.dispatchEvent(new Event('plano-install-change'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (e) {
            console.warn('オフライン対応の準備に失敗しました', e);
          });
        });
      }
    </script>
  </head>

  <body>
    <noscript>Plano を使うには JavaScript を有効にしてください。</noscript>
    <div id="root"></div>
  </body>
</html>
