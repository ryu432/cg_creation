# supabase/ に変更をプッシュすると、テストしてから Supabase Edge Functions にデプロイする。
# AI プラン提案のサーバー処理（supabase/functions/plan）がここで公開される。
name: Supabase Functions

on:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

env:
  # Supabase のプロジェクト ID（Project Settings > General の Project ID）。秘密の情報ではない
  SUPABASE_PROJECT_REF: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x

      - name: Test
        run: deno test supabase/functions/

      - name: Check settings
        id: settings
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::notice::Supabase の設定（SUPABASE_PROJECT_REF / SUPABASE_ACCESS_TOKEN）がまだないため、デプロイをスキップします"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v3
        if: steps.settings.outputs.ready == 'true'
        with:
          version: latest

      - name: Deploy
        if: steps.settings.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy plan --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
