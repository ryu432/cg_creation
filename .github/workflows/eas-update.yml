# mobile/ に変更をプッシュすると、EAS Update で公開する。
# Plano 専用アプリ（preview チャンネルでビルドしたもの）が、次に開いたときに最新版を受け取る。
# 部品の構成（ネイティブ部分）が変わった更新は、作り直したアプリにだけ届く（runtimeVersion: fingerprint）
name: EAS Update

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check EXPO_TOKEN
        working-directory: .
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN が未登録です。Settings > Secrets and variables > Actions で登録してください。"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        run: eas update --channel preview --message "$(git log -1 --pretty=%s)" --non-interactive
